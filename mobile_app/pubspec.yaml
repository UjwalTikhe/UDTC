name: sih_field_drug_testing
description: Digital Companion for Field Drug Testing - NCB SIH26231
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  sqflite: ^2.3.2
  sqflite_sqlcipher: ^3.0.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  telephony: ^0.2.0
  geolocator: ^10.1.0
  http: ^1.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  qr_code_scanner: ^1.0.1
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/reference_card_print.png
    - assets/field_sample_positive.png
    - assets/field_sample_negative.png
    - assets/field_sample_blurry.png
