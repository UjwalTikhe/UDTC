name: sih_field_drug_testing
description: Digital Companion for Field Drug Testing - NCB SIH26231
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  geolocator: ^10.1.0
  http: ^1.2.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  image: ^4.10.1
  connectivity_plus: ^6.1.0
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/mha_emblem.png
    - assets/reference_card_print.png
    - assets/field_sample_positive.png
    - assets/field_sample_negative.png
    - assets/field_sample_blurry.png
